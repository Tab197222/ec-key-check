<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Members | iLoveLatins</title>
  <meta name="description" content="Browse approved iLoveLatins members in Colombia and beyond.">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=202611140804">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header data-header></header>

  <main id="main">
    <section class="page-head">
      <div class="wrap">
        <h1>Members</h1>
        <p class="lead">Every profile here has been checked by a person before it goes live.</p>
      </div>
    </section>
    <section class="band">
      <div class="wrap">
        <p class="lang-switch"><button type="button" class="link" data-lang-toggle></button></p>
        <div data-app>
          <form class="filters" id="filters">
            <label><span data-i18n="show">Show</span>
              <select name="gender">
                <option value="woman" data-i18n="women">Women</option>
                <option value="man" data-i18n="men">Men</option>
              </select>
            </label>
            <label><span data-i18n="city_filter">City</span>
              <input type="text" name="city" placeholder="Barranquilla">
            </label>
            <label><span>&nbsp;</span>
              <select name="age">
                <option value="" data-i18n="any_age">Any age</option>
                <option value="18-25">18–25</option>
                <option value="26-35">26–35</option>
                <option value="36-45">36–45</option>
                <option value="46-99">46+</option>
              </select>
            </label>
            <label><span data-i18n="looking_for">Looking for</span>
              <select name="looking_for" data-opts="looking_for"></select>
            </label>
            <label><span data-i18n="english">English</span>
              <select name="english" data-opts="english"></select>
            </label>
            <label><span data-i18n="has_children">Children</span>
              <select name="has_children" data-opts="has_children"></select>
            </label>
            <label class="check-inline"><input type="checkbox" name="verified"> <span data-i18n="verified">Verified</span></label>
            <label class="check-inline"><input type="checkbox" name="online"> <span data-i18n="online">Online now</span></label>
            <button class="btn" type="submit">Search</button>
          </form>
          <p class="notice" id="login-note" hidden><span data-i18n="login_to_view"></span> <a href="join.html" data-i18n="join_free">Join free</a></p>
          <div class="member-grid" id="grid"></div>
        </div>
      </div>
    </section>
  </main>

  <footer data-footer></footer>
  <script src="js/vendor/supabase.js?v=202611140804"></script>
  <script src="js/data.js?v=202611140804"></script>
  <script src="js/site.js?v=202611140804"></script>
  <script src="js/config.js?v=202611140804"></script>
  <script src="js/app.js?v=202611140804"></script>
  <script src="js/members.js?v=202611140804"></script>
</body>
</html>
